name: Playwright PR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: playwright-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
      - run: bun install --frozen-lockfile
      - run: bun run check:target
        env:
          E2E_TARGET: staging
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test:contracts
      - run: bun run check:title-parity

  api-smoke:
    name: API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      E2E_TARGET: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
      - run: bun install --frozen-lockfile
      - run: bun run check:target
      - run: bunx playwright test --project=api --grep @smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: pr-api-report
          path: |
            playwright-report/
            results/
            test-results/
          retention-days: 14

  e2e-smoke:
    name: Chromium smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      E2E_TARGET: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
      - run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-chromium-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - run: bun run check:target
      - run: bunx playwright test --project=e2e --grep @smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: pr-e2e-report
          path: |
            playwright-report/
            results/
            test-results/
          retention-days: 14
