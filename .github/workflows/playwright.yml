name: E2E & API Tests

# Run all tests against the live demo shop.
on:
  pull_request:
    branches: [main] # PR into main
  push:
    branches: [main] # push to main
  schedule:
    # Every night at 5 AM Pacific.
    - cron: '0 5 * * *'
      timezone: 'America/Los_Angeles'
  workflow_dispatch: # run by hand

# Job only needs read access to the repo.
permissions:
  contents: read

# New PR push cancels the old run. Other runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Playwright (setup + e2e-chromium + api)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Playwright image has browsers + Node. Tag matches package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # pnpm version from package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          # Without these the run is guest-only. The public demo needs no secrets.
          E2E_ACCOUNT_EMAIL: ${{ secrets.E2E_ACCOUNT_EMAIL }}
          E2E_ACCOUNT_PASSWORD: ${{ secrets.E2E_ACCOUNT_PASSWORD }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  spec-drift:
    name: SCAPI spec drift
    # Re-fetches the specs from upstream, so it answers "did Salesforce change
    # the contract", not "is this PR correct". Nightly and on demand only.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:api:fetch && pnpm gen:api
        env:
          # Lifts the unauthenticated GitHub API rate limit for the one call
          # that lists published spec versions.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Which families moved
        if: ${{ !cancelled() }}
        run: git --no-pager diff -- api/specs/MANIFEST.json
      - name: Fail if the vendored contract is stale
        run: git diff --exit-code --stat -- api/specs api/generated
